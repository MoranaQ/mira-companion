name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repo structure
        run: |
          echo "=== Root ==="
          ls -la
          echo ""
          echo "=== Search for Android project files ==="
          find . -maxdepth 3 \( -name "gradlew" -o -name "build.gradle*" -o -name "settings.gradle*" -o -name "AndroidManifest.xml" \) | head -200

      - name: Extract Android project ZIP if exists
        run: |
          if [ -f "mira-android-companion-project.zip" ]; then
            echo "ZIP file found, extracting..."
            unzip -q mira-android-companion-project.zip -d .
            ls -la
            echo ""
            echo "=== Extracted folders ==="
            find . -maxdepth 2 -type d | sed 's#^\./##' | sort
          else
            echo "No ZIP file found in root."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            find . -name "gradlew" -exec chmod +x {} \;
          fi

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "mira-android-companion-project/gradlew" ]; then
            cd mira-android-companion-project
            ./gradlew assembleDebug --stacktrace
          else
            echo "ERROR: gradlew not found"
            find . -name "gradlew"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            mira-android-companion-project/app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/**/app-*.apk
          if-no-files-found: warn
